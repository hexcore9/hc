<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREMIUM KEY // ACCESS GRANTED</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #050505;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    color: #00ff9d;
    overflow: hidden;
    position: relative;
  }

  .bg-grid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(rgba(0, 255, 157, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 157, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    z-index: 0;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  .scanlines {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0, 255, 157, 0.03) 50%,
      transparent 100%
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
    animation: scan 8s linear infinite;
  }

  @keyframes scan {
    0% { background-position: 0 0; }
    100% { background-position: 0 100%; }
  }

  .vignette {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 9;
  }

  .card {
    background: linear-gradient(145deg, rgba(0, 25, 15, 0.95), rgba(0, 10, 5, 0.98));
    width: 100%;
    max-width: 430px;
    border: 1px solid #00ff9d;
    border-radius: 8px;
    padding: 40px 32px;
    text-align: center;
    position: relative;
    z-index: 5;
    box-shadow: 
      0 0 0 1px rgba(0, 255, 157, 0.1),
      0 0 30px rgba(0, 255, 157, 0.15),
      0 0 60px rgba(0, 255, 157, 0.05),
      inset 0 0 40px rgba(0, 255, 157, 0.03);
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2px solid #00ff9d;
  }
  .card::before {
    top: -1px;
    left: -1px;
    border-right: none;
    border-bottom: none;
  }
  .card::after {
    bottom: -1px;
    right: -1px;
    border-left: none;
    border-top: none;
  }

  .corner-tr, .corner-bl {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid #00ff9d;
    opacity: 0.6;
  }
  .corner-tr {
    top: -1px;
    right: -1px;
    border-left: none;
    border-bottom: none;
  }
  .corner-bl {
    bottom: -1px;
    left: -1px;
    border-right: none;
    border-top: none;
  }

  .logo {
    width: 90px;
    height: 90px;
    background: radial-gradient(circle, #003d28, #001a10);
    border: 1px solid #00ff9d;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 
      0 0 25px rgba(0, 255, 157, 0.45),
      inset 0 0 15px rgba(0, 255, 157, 0.1);
    position: relative;
    animation: pulseGlow 3s ease-in-out infinite;
    overflow: hidden;
  }

  .logo img {
    width: 70%;
    height: 70%;
    object-fit: contain;
    border-radius: 8px;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 157, 0.4), inset 0 0 15px rgba(0, 255, 157, 0.1); }
    50% { box-shadow: 0 0 40px rgba(0, 255, 157, 0.75), inset 0 0 20px rgba(0, 255, 157, 0.2); }
  }

  .logo::after {
    content: "";
    position: absolute;
    inset: -6px;
    border: 1px dashed rgba(0, 255, 157, 0.35);
    border-radius: 20px;
    animation: rotateDash 12s linear infinite;
  }

  @keyframes rotateDash {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 8px;
    color: #00ff9d;
    letter-spacing: 3px;
    text-shadow: 
      0 0 10px rgba(0, 255, 157, 0.8),
      0 0 20px rgba(0, 255, 157, 0.4);
  }

  .subtitle {
    font-size: 13px;
    color: #00cc7a;
    margin-bottom: 32px;
    line-height: 1.7;
    opacity: 0.9;
  }

  .status-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    font-size: 11px;
    color: #00aa66;
    letter-spacing: 1px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #00ff9d;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px #00ff9d;
    animation: blinkDot 1.5s infinite;
  }

  @keyframes blinkDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .key-box {
    background: #001a10;
    border: 1px solid #00ff9d;
    border-radius: 6px;
    padding: 20px 16px;
    margin: 24px 0 18px;
    font-size: 18px;
    font-weight: 600;
    color: #00ff9d;
    letter-spacing: 2.5px;
    word-break: break-all;
    display: none;
    position: relative;
    box-shadow: 
      inset 0 0 20px rgba(0, 255, 157, 0.08),
      0 0 15px rgba(0, 255, 157, 0.15);
  }

  .key-box::before {
    content: ">>> ";
    color: #00ff9d;
    opacity: 0.7;
  }

  .expire {
    margin-top: 12px;
    font-size: 12px;
    color: #00aa66;
    font-weight: 500;
    letter-spacing: 1px;
  }

  .btn {
    width: 100%;
    padding: 16px;
    background: transparent;
    color: #00ff9d;
    border: 1px solid #00ff9d;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Share Tech Mono', monospace;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 157, 0.25), transparent);
    transition: 0.5s;
  }

  .btn:hover::before {
    left: 100%;
  }

  .btn:hover {
    background: rgba(0, 255, 157, 0.15);
    box-shadow: 0 0 25px rgba(0, 255, 157, 0.4);
    transform: translateY(-2px);
  }

  .btn-continue {
    background: linear-gradient(135deg, #00ff9d, #00cc7a);
    color: #001a10 !important;
    border: none;
    font-weight: 700;
    box-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
  }

  .btn-continue:hover {
    background: linear-gradient(135deg, #00ffb3, #00e68a);
    box-shadow: 0 0 35px rgba(0, 255, 157, 0.7);
    transform: translateY(-3px);
  }

  .loading {
    display: none;
    margin: 24px 0;
    color: #00ff9d;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .loading::after {
    content: "█";
    animation: blink 0.8s step-end infinite;
    margin-left: 4px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .message {
    margin-top: 20px;
    font-size: 13px;
    color: #ff4d4d;
    display: none;
    line-height: 1.6;
    text-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
  }

  .footer {
    margin-top: 32px;
    font-size: 11px;
    color: #007a4d;
    letter-spacing: 2px;
    opacity: 0.85;
  }

  .terminal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0, 255, 157, 0.2);
    font-size: 11px;
    color: #00aa66;
  }

  .terminal-dots {
    display: flex;
    gap: 6px;
  }

  .terminal-dots span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff9d;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="card">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <div class="terminal-header">
      <div class="terminal-dots">
        <span></span><span></span><span></span>
      </div>
      <span>SECURE_ACCESS</span>
    </div>

    <!-- ★★★ Your logo will appear here ★★★ -->
    <div class="logo">
      <img src="assets/logo.png" alt="Logo">
    </div>
    
    <h1>PREMIUM KEY</h1>
    
    <div class="status-bar">
      <span class="status-dot"></span>
      SYSTEM ONLINE • READY
    </div>

    <p class="subtitle">Click the button below and complete the Ad to unlock your Key</p>

    <button class="btn btn-continue" id="continueBtn" onclick="goToShortener()">
      ▶ Continue to Unlock Key
    </button>

    <div class="loading" id="loading">Generating Key...</div>

    <div class="key-box" id="keyBox">
      <span id="finalKey"></span>
      <div class="expire">Valid for: 1 Day • Device Locked</div>
    </div>

    <button class="btn" id="copyBtn" style="display:none;" onclick="copyKey()">
      ⧉ Copy Key
    </button>

    <div class="message" id="message"></div>

    <div class="footer">Secure Key System • IP Locked</div>
  </div>

<script>
  // ★★★ Put your key.py API link here ★★★  
  const API = "http://192.168.1.103:5000";  
  
  // ★★★ Put your Shortener link here ★★★  
  const SHORTENER_LINK = "https://urlking.in/cc1fa1";  
  
  window.onload = function () {  
    const referrer = document.referrer.toLowerCase();  
  
    // Security: Only give Key if coming from get.urlking.in  
    if (referrer.includes("get.urlking.in")) {  
  
      // Prevent generating more than one Key per day  
      const today = new Date().toDateString();  
      const lastGenerated = localStorage.getItem("lastKeyDate");  
  
      if (lastGenerated === today) {  
        document.getElementById("continueBtn").style.display = "none";  
        document.getElementById("message").style.display = "block";  
        document.getElementById("message").innerText = "You have already received a Key today.\nPlease try again tomorrow.";  
        return;  
      }  
  
      document.getElementById("continueBtn").style.display = "none";  
      generateKey();  
    }  
  };  
  
  function goToShortener() {  
    window.location.href = SHORTENER_LINK;  
  }  
  
  async function generateKey() {  
    const loading = document.getElementById("loading");  
    const keyBox = document.getElementById("keyBox");  
    const finalKey = document.getElementById("finalKey");  
    const copyBtn = document.getElementById("copyBtn");  
  
    loading.style.display = "block";  
  
    // 1 Day validity  
    const now = new Date();  
    now.setDate(now.getDate() + 1);  
    const expireDate = now.getFullYear() + "-" +  
                       String(now.getMonth() + 1).padStart(2, "0") + "-" +  
                       String(now.getDate()).padStart(2, "0") + " " +  
                       String(now.getHours()).padStart(2, "0") + ":" +  
                       String(now.getMinutes()).padStart(2, "0") + ":" +  
                       String(now.getSeconds()).padStart(2, "0");  
  
    const newKey = "KEY-" + Math.random().toString(36).substring(2, 12).toUpperCase();  
  
    try {  
      // Get user's IP  
      const ipRes = await fetch("https://api.ipify.org?format=json");  
      const ipData = await ipRes.json();  
      const userIP = ipData.ip;  
  
      // Send Key + IP to server  
      const res = await fetch(`${API}/register`, {  
        method: "POST",  
        headers: { "Content-Type": "application/json" },  
        body: JSON.stringify({  
          key: newKey,  
          expire: expireDate,  
          ip: userIP  
        })  
      });  
  
      const data = await res.json();  
      loading.style.display = "none";  
  
      if (data.status) {  
        localStorage.setItem("lastKeyDate", new Date().toDateString());  
  
        finalKey.innerText = newKey;  
        keyBox.style.display = "block";  
        copyBtn.style.display = "block";  
      } else {  
        finalKey.innerText = "Failed to generate Key";  
        keyBox.style.display = "block";  
      }  
    } catch (err) {  
      loading.style.display = "none";  
      finalKey.innerText = "Server connection failed";  
      keyBox.style.display = "block";  
    }  
  }  
  
  function copyKey() {  
    const keyText = document.getElementById("finalKey").innerText;  
    navigator.clipboard.writeText(keyText).then(() => {  
      const btn = document.getElementById("copyBtn");  
      btn.innerText = "Copied ✓";  
      setTimeout(() => {  
        btn.innerText = "⧉ Copy Key";  
      }, 2000);  
    });  
  }  
</script>
</body>
</html>
