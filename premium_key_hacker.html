<!DOCTYPE html>  <html lang="bn">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Get Premium Key</title>  
<style>  
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Fira+Code:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #05070a;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(0,255,140,0.06), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0,255,140,0.05), transparent 40%),
    repeating-linear-gradient(0deg, rgba(0,255,140,0.03) 0px, rgba(0,255,140,0.03) 1px, transparent 1px, transparent 3px);
  font-family: 'Fira Code', 'Share Tech Mono', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  color: #baffc9;
}

.card {
  background: #0a0f0c;
  width: 100%;
  max-width: 420px;
  border-radius: 12px;
  padding: 40px 32px;
  box-shadow:
    0 0 0 1px rgba(0,255,140,0.25),
    0 0 25px rgba(0,255,140,0.15),
    0 25px 50px -12px rgba(0, 0, 0, 0.6);
  text-align: center;
  border: 1px solid rgba(0,255,140,0.35);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00ff8c, transparent);
  animation: scanline 3s linear infinite;
}

@keyframes scanline {
  0% { transform: translateY(0); opacity: 0.8; }
  100% { transform: translateY(400px); opacity: 0; }
}

.logo {
  width: 72px;
  height: 72px;
  background: #000;
  color: #00ff8c;
  font-size: 30px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  border: 1px solid #00ff8c;
  box-shadow: 0 0 20px rgba(0,255,140,0.5), inset 0 0 15px rgba(0,255,140,0.2);
  text-shadow: 0 0 10px #00ff8c;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #00ff8c;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 0 12px rgba(0,255,140,0.6);
}

.subtitle {
  font-size: 13px;
  color: #6fae86;
  margin-bottom: 32px;
  line-height: 1.6;
}

.key-box {
  background: #000;
  border: 1px dashed #00ff8c;
  border-radius: 8px;
  padding: 22px;
  margin: 28px 0 20px;
  font-size: 17px;
  font-weight: 600;
  color: #00ff8c;
  letter-spacing: 1px;
  word-break: break-all;
  display: none;
  text-shadow: 0 0 8px rgba(0,255,140,0.7);
  box-shadow: inset 0 0 12px rgba(0,255,140,0.15);
}

.expire {
  margin-top: 10px;
  font-size: 12px;
  color: #4d7a5f;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.btn {
  width: 100%;
  padding: 16px;
  background: #000;
  color: #00ff8c;
  border: 1px solid #00ff8c;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}

.btn:hover {
  background: #00ff8c;
  color: #000;
  box-shadow: 0 0 20px rgba(0,255,140,0.6);
}

.btn-continue {
  background: #000;
}

.loading {
  display: none;
  margin: 24px 0;
  color: #00ff8c;
  font-size: 14px;
  letter-spacing: 1px;
}

.loading::after {
  content: "_";
  animation: blink 1s step-start infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

.message {
  margin-top: 20px;
  font-size: 13px;
  color: #ff4d6d;
  display: none;
  line-height: 1.5;
  white-space: pre-line;
}

.footer {
  margin-top: 32px;
  font-size: 11px;
  color: #3d5f4a;
  letter-spacing: 1px;
  text-transform: uppercase;
}
</style>

</head>  
<body>  <div class="card">  
  <div class="logo">🔑</div>  
  <h1>Premium Key</h1>  
  <p class="subtitle">Key পেতে নিচের বাটনে ক্লিক করে Ad complete করুন</p>    <button class="btn btn-continue" id="continueBtn" onclick="goToShortener()">  
    Continue to Unlock Key  
  </button>    <div class="loading" id="loading">Key তৈরি হচ্ছে...</div>    <div class="key-box" id="keyBox">  
    <span id="finalKey"></span>  
    <div class="expire">মেয়াদ: ১ দিন • Device Locked</div>  
  </div>    <button class="btn" id="copyBtn" style="display:none;" onclick="copyKey()">  
    Copy Key  
  </button>    <div class="message" id="message"></div>    <div class="footer">Secure Key System • IP Locked</div>  
</div>  <script>  
  // ★★★ এখানে আপনার key.py এর API লিংক বসাবেন ★★★  
  const API = "http://YOUR-SERVER-IP:5000";  
  
  // ★★★ এখানে আপনার Shortener লিংক বসাবেন ★★★  
  const SHORTENER_LINK = "https://get.urlking.in/your-actual-link";  
  
  window.onload = function () {  
    const referrer = document.referrer.toLowerCase();  
  
    // সিকিউরিটি: শুধুমাত্র get.urlking.in থেকে এলেই Key দিবে  
    if (referrer.includes("get.urlking.in")) {  
  
      // একদিনে একবারের বেশি Key জেনারেট বন্ধ  
      const today = new Date().toDateString();  
      const lastGenerated = localStorage.getItem("lastKeyDate");  
  
      if (lastGenerated === today) {  
        document.getElementById("continueBtn").style.display = "none";  
        document.getElementById("message").style.display = "block";  
        document.getElementById("message").innerText = "আজকে ইতিমধ্যে Key নেওয়া হয়েছে।\nআগামীকাল আবার চেষ্টা করুন।";  
        return;  
      }  
  
      document.getElementById("continueBtn").style.display = "none";  
      generateKey();  
    }  
  };  
  
  function goToShortener() {  
    window.location.href = SHORTENER_LINK;  
  }  
  
  async function generateKey() {  
    const loading = document.getElementById("loading");  
    const keyBox = document.getElementById("keyBox");  
    const finalKey = document.getElementById("finalKey");  
    const copyBtn = document.getElementById("copyBtn");  
  
    loading.style.display = "block";  
  
    // ১ দিনের মেয়াদ  
    const now = new Date();  
    now.setDate(now.getDate() + 1);  
    const expireDate = now.getFullYear() + "-" +  
                       String(now.getMonth() + 1).padStart(2, "0") + "-" +  
                       String(now.getDate()).padStart(2, "0") + " " +  
                       String(now.getHours()).padStart(2, "0") + ":" +  
                       String(now.getMinutes()).padStart(2, "0") + ":" +  
                       String(now.getSeconds()).padStart(2, "0");  
  
    const newKey = "KEY-" + Math.random().toString(36).substring(2, 12).toUpperCase();  
  
    try {  
      // ইউজারের IP বের করা  
      const ipRes = await fetch("https://api.ipify.org?format=json");  
      const ipData = await ipRes.json();  
      const userIP = ipData.ip;  
  
      // Key + IP একসাথে সার্ভারে পাঠানো  
      const res = await fetch(`${API}/register`, {  
        method: "POST",  
        headers: { "Content-Type": "application/json" },  
        body: JSON.stringify({  
          key: newKey,  
          expire: expireDate,  
          ip: userIP  
        })  
      });  
  
      const data = await res.json();  
      loading.style.display = "none";  
  
      if (data.status) {  
        localStorage.setItem("lastKeyDate", new Date().toDateString());  
  
        finalKey.innerText = newKey;  
        keyBox.style.display = "block";  
        copyBtn.style.display = "block";  
      } else {  
        finalKey.innerText = "Key তৈরি ব্যর্থ হয়েছে";  
        keyBox.style.display = "block";  
      }  
    } catch (err) {  
      loading.style.display = "none";  
      finalKey.innerText = "Server কানেক্ট হয়নি";  
      keyBox.style.display = "block";  
    }  
  }  
  
  function copyKey() {  
    const keyText = document.getElementById("finalKey").innerText;  
    navigator.clipboard.writeText(keyText).then(() => {  
      const btn = document.getElementById("copyBtn");  
      btn.innerText = "Copied ✓";  
      setTimeout(() => {  
        btn.innerText = "Copy Key";  
      }, 2000);  
    });  
  }  
</script>  </body>  
</html>
