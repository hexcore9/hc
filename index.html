<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Premium Key</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #f8fafc, #eef2ff);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    color: #0f172a;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 28px;
    padding: 40px 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    text-align: center;
    border: 1px solid #f1f5f9;
  }

  .logo {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #0f172a, #334155);
    color: white;
    font-size: 30px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #0f172a;
  }

  .subtitle {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .key-box {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 18px;
    padding: 22px;
    margin: 28px 0 20px;
    font-size: 18px;
    font-weight: 600;
    color: #0f172a;
    letter-spacing: 1px;
    word-break: break-all;
    display: none;
  }

  .expire {
    margin-top: 10px;
    font-size: 13px;
    color: #94a3b8;
    font-weight: 500;
  }

  .btn {
    width: 100%;
    padding: 17px;
    background: #0f172a;
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .btn:hover {
    background: #1e293b;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
  }

  .btn-continue {
    background: linear-gradient(135deg, #0f172a, #334155);
  }

  .loading {
    display: none;
    margin: 24px 0;
    color: #64748b;
    font-size: 15px;
  }

  .message {
    margin-top: 20px;
    font-size: 14px;
    color: #dc2626;
    display: none;
    line-height: 1.5;
  }

  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔑</div>
  <h1>Premium Key</h1>
  <p class="subtitle">Key পেতে নিচের বাটনে ক্লিক করে Ad complete করুন</p>

  <button class="btn btn-continue" id="continueBtn" onclick="goToShortener()">
    Continue to Unlock Key
  </button>

  <div class="loading" id="loading">Key তৈরি হচ্ছে...</div>

  <div class="key-box" id="keyBox">
    <span id="finalKey"></span>
    <div class="expire">মেয়াদ: ১ দিন</div>
  </div>

  <button class="btn" id="copyBtn" style="display:none;" onclick="copyKey()">
    Copy Key
  </button>

  <div class="message" id="message"></div>

  <div class="footer">Secure Key System</div>
</div>

<script>
  // ★★★ এখানে আপনার key.py এর API লিংক বসাবেন ★★★
  const API = "http://192.168.1.105:5000";

  // ★★★ এখানে আপনার Shortener লিংক বসাবেন ★★★
  const SHORTENER_LINK = "https://urlking.in/cc1fa1";

  window.onload = function () {
    const referrer = document.referrer.toLowerCase();

    // ★ সিকিউরিটি: শুধুমাত্র get.urlking.in থেকে এলেই Key দিবে
    if (referrer.includes("get.urlking.in")) {

      // একদিনে একবারের বেশি Key জেনারেট বন্ধ
      const today = new Date().toDateString();
      const lastGenerated = localStorage.getItem("lastKeyDate");

      if (lastGenerated === today) {
        document.getElementById("continueBtn").style.display = "none";
        document.getElementById("message").style.display = "block";
        document.getElementById("message").innerText = "আজকে ইতিমধ্যে Key নেওয়া হয়েছে।\nআগামীকাল আবার চেষ্টা করুন।";
        return;
      }

      document.getElementById("continueBtn").style.display = "none";
      generateKey();
    }
  };

  function goToShortener() {
    window.location.href = SHORTENER_LINK;
  }

  async function generateKey() {
    const loading = document.getElementById("loading");
    const keyBox = document.getElementById("keyBox");
    const finalKey = document.getElementById("finalKey");
    const copyBtn = document.getElementById("copyBtn");

    loading.style.display = "block";

    // ১ দিনের মেয়াদ
    const now = new Date();
    now.setDate(now.getDate() + 1);
    const expireDate = now.getFullYear() + "-" +
                       String(now.getMonth() + 1).padStart(2, "0") + "-" +
                       String(now.getDate()).padStart(2, "0") + " " +
                       String(now.getHours()).padStart(2, "0") + ":" +
                       String(now.getMinutes()).padStart(2, "0") + ":" +
                       String(now.getSeconds()).padStart(2, "0");

    const newKey = "KEY-" + Math.random().toString(36).substring(2, 12).toUpperCase();

    try {
      const res = await fetch(`${API}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          key: newKey,
          expire: expireDate
        })
      });

      const data = await res.json();
      loading.style.display = "none";

      if (data.status) {
        localStorage.setItem("lastKeyDate", new Date().toDateString());

        finalKey.innerText = newKey;
        keyBox.style.display = "block";
        copyBtn.style.display = "block";
      } else {
        finalKey.innerText = "Key তৈরি ব্যর্থ হয়েছে";
        keyBox.style.display = "block";
      }
    } catch (err) {
      loading.style.display = "none";
      finalKey.innerText = "Server কানেক্ট হয়নি";
      keyBox.style.display = "block";
    }
  }

  function copyKey() {
    const keyText = document.getElementById("finalKey").innerText;
    navigator.clipboard.writeText(keyText).then(() => {
      const btn = document.getElementById("copyBtn");
      btn.innerText = "Copied ✓";
      setTimeout(() => {
        btn.innerText = "Copy Key";
      }, 2000);
    });
  }
</script>
</body>
</html>
