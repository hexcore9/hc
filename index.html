<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Admin Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f13;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    padding: 40px 20px;
  }
  .box {
    background: #1a1a24;
    padding: 35px;
    border-radius: 18px;
    max-width: 480px;
    margin: 0 auto;
    box-shadow: 0 0 40px rgba(0, 255, 150, 0.12);
  }
  h2 {
    color: #00ff99;
    margin-bottom: 25px;
    text-align: center;
  }
  h3 {
    margin: 25px 0 12px;
    color: #ccc;
    font-size: 16px;
  }
  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: none;
    background: #111;
    color: #fff;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #00ff99, #00cc77);
    color: #000;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.25s;
  }
  button:hover {
    transform: scale(1.03);
  }
  .msg {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    display: none;
  }
  .success { background: #003d2a; color: #00ff99; }
  .error { background: #3d0000; color: #ff6b6b; }
</style>
</head>
<body>
  <div class="box">
    <h2>🔑 Key Admin Panel</h2>

    <!-- ===================== Register ===================== -->
    <h3>নতুন Key রেজিস্টার করুন</h3>
    <input type="text" id="newKey" placeholder="Key লিখুন (যেমন: KEY-ABC123)">
    <input type="text" id="expireDate" placeholder="Expire Date (YYYY-MM-DD HH:MM:SS) — খালি রাখলে Unlimited">
    <button onclick="registerKey()">Register Key</button>
    <div id="regMsg" class="msg"></div>

    <!-- ===================== Expire ===================== -->
    <h3>Key Expire / Delete করুন</h3>
    <input type="text" id="delKey" placeholder="যে Key মুছতে চান সেটা লিখুন">
    <button onclick="expireKey()">Expire Key</button>
    <div id="delMsg" class="msg"></div>
  </div>

<script>
  // ★★★ এখানে আপনার key.py এর API লিংক বসাবেন ★★★
  const API = "http://127.0.0.1:5000";   // উদাহরণ: "http://192.168.1.10:5000" বা "https://yourdomain.com"

  function showMsg(id, text, isSuccess) {
    const el = document.getElementById(id);
    el.style.display = "block";
    el.className = "msg " + (isSuccess ? "success" : "error");
    el.innerText = text;
  }

  async function registerKey() {
    const key = document.getElementById("newKey").value.trim();
    const expire = document.getElementById("expireDate").value.trim();

    if (!key) {
      showMsg("regMsg", "Key লিখুন!", false);
      return;
    }

    try {
      const res = await fetch(`${API}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key, expire: expire })
      });
      const data = await res.json();

      if (data.status) {
        showMsg("regMsg", "✅ " + data.message, true);
        document.getElementById("newKey").value = "";
        document.getElementById("expireDate").value = "";
      } else {
        showMsg("regMsg", "❌ " + data.message, false);
      }
    } catch (err) {
      showMsg("regMsg", "❌ Server-এ কানেক্ট করা যাচ্ছে না। API লিংক চেক করুন।", false);
    }
  }

  async function expireKey() {
    const key = document.getElementById("delKey").value.trim();

    if (!key) {
      showMsg("delMsg", "Key লিখুন!", false);
      return;
    }

    try {
      const res = await fetch(`${API}/expire`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key })
      });
      const data = await res.json();

      if (data.status) {
        showMsg("delMsg", "✅ " + data.message, true);
        document.getElementById("delKey").value = "";
      } else {
        showMsg("delMsg", "❌ " + data.message, false);
      }
    } catch (err) {
      showMsg("delMsg", "❌ Server-এ কানেক্ট করা যাচ্ছে না। API লিংক চেক করুন।", false);
    }
  }
</script>
</body>
</html>
