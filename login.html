<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Secure Access</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex; align-items: center; justify-content: center;
      color: #fff; overflow-x: hidden;
    }
    .container { width: 100%; max-width: 420px; padding: 20px; }
    .card {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(16px);
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.15);
      padding: 36px 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 {
      font-size: 1.8rem; font-weight: 700;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo p { font-size: 0.85rem; color: #aaa; margin-top: 6px; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 0.8rem; color: #bbb; margin-bottom: 6px; }
    #keyInput {
      width: 100%; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.35);
      color: #fff; font-size: 0.95rem; outline: none;
    }
    #keyInput:focus { border-color: #00d2ff; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease; margin-bottom: 12px;
    }
    .btn-login { background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,176,155,0.4); }
    .btn-getkey { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
    .btn-getkey:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,87,108,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .message {
      margin-top: 16px; padding: 12px 16px; border-radius: 10px;
      font-size: 0.9rem; text-align: center; display: none;
    }
    .message.success { background: rgba(0,200,100,0.2); border: 1px solid #00c864; color: #7dffa8; }
    .message.error { background: rgba(255,60,60,0.2); border: 1px solid #ff3c3c; color: #ff9a9a; }
    .maintenance-overlay {
      position: fixed; inset: 0; background: rgba(10,10,30,0.95);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; text-align: center; padding: 30px;
    }
    .maintenance-overlay.active { display: flex; }
    .maintenance-box h2 { font-size: 1.6rem; margin-bottom: 12px; color: #ffcc00; }
    .maintenance-box p { color: #ccc; line-height: 1.6; }
    .footer { text-align: center; margin-top: 20px; font-size: 0.75rem; color: #666; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="maintenance-overlay" id="maintenanceOverlay">
    <div class="maintenance-box">
      <h2>🔧 Maintenance Mode</h2>
      <p id="maintenanceMsg">This website has been under maintenance. Please wait for update.</p>
    </div>
  </div>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>SECURE LOGIN</h1>
        <p>Key based authentication system</p>
      </div>
      <div class="input-group">
        <label for="keyInput">Your Access Key</label>
        <input type="text" id="keyInput" placeholder="Enter your key here..." autocomplete="off" />
      </div>
      <button class="btn btn-login" id="btnLogin">LOGIN</button>
      <button class="btn btn-getkey" id="btnGetKey">GET KEY</button>
      <div class="message" id="msgBox"></div>
    </div>
    <div class="footer">Protected System • Do not share your key</div>
  </div>
  <script>
    const SERVER_URL = "http://127.0.0.1:5000/api/";
    const keyInput = document.getElementById("keyInput");
    const btnLogin = document.getElementById("btnLogin");
    const btnGetKey = document.getElementById("btnGetKey");
    const msgBox = document.getElementById("msgBox");
    const maintenanceOverlay = document.getElementById("maintenanceOverlay");
    const maintenanceMsg = document.getElementById("maintenanceMsg");

    function showMessage(text, type = "info") {
      msgBox.textContent = text;
      msgBox.className = "message " + type;
      msgBox.style.display = "block";
    }
    function hideMessage() { msgBox.style.display = "none"; }

    async function getClientIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
      } catch (e) { return ""; }
    }

    async function checkMaintenance() {
      try {
        const res = await fetch(`${SERVER_URL}/api/settings`);
        const data = await res.json();
        if (data.maintenance_mode) {
          maintenanceMsg.textContent = data.maintenance_message || "This website has been under maintenance. Please wait for update.";
          maintenanceOverlay.classList.add("active");
        }
        window.GET_KEY_URL = data.get_key_url || "#";
      } catch (e) { window.GET_KEY_URL = "#"; }
    }

    btnLogin.addEventListener("click", async () => {
      const key = keyInput.value.trim();
      if (!key) { showMessage("Please enter a key first", "error"); return; }
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span class="spinner"></span> Checking...';
      hideMessage();
      try {
        const ip = await getClientIP();
        const res = await fetch(`${SERVER_URL}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key, ip })
        });
        const data = await res.json();
        if (data.status === true) {
          showMessage("✅ LOGIN SUCCESS", "success");
          setTimeout(() => alert("Login Successful!"), 500);
        } else {
          const err = data.error || "login failed";
          let msg = "Login Failed";
          if (err === "wrong key") msg = "❌ ভুল কি (Wrong Key)";
          else if (err === "expire key") msg = "⏰ Key Expired";
          else if (err === "ip not match") msg = "🌐 IP Address Not Matched";
          else msg = "❌ " + err;
          showMessage(msg, "error");
        }
      } catch (e) {
        showMessage("Server connection failed. Is the server running?", "error");
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "LOGIN";
      }
    });

    btnGetKey.addEventListener("click", () => {
      const url = window.GET_KEY_URL || "#";
      if (url && url !== "#") window.open(url, "_blank");
      else showMessage("GET KEY link not configured. Set it from Admin panel.", "error");
    });

    keyInput.addEventListener("keypress", (e) => { if (e.key === "Enter") btnLogin.click(); });
    checkMaintenance();
  </script>
</body>
</html>
